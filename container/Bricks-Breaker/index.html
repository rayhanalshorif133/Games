<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bricks Breaker - 100 Levels</title>
    <link rel="icon" type="image/png" href="icons/icon-64.png">
    <link rel="apple-touch-icon" sizes="128x128" href="icons/icon-128.png">
    <link rel="apple-touch-icon" sizes="256x256" href="icons/icon-256.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
    <meta name="theme-color" content="#030208">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Main 1080x1920 Game Canvas -->
        <canvas id="gameCanvas" width="1080" height="1920"></canvas>

        <!-- Tap zones for HUD buttons -->
        <div id="pause-btn-zone" class="hud-btn-zone" title="Pause Game"></div>
        <div id="settings-btn-zone" class="hud-btn-zone" title="Settings"></div>

        <!-- Launch Hint -->
        <div id="launch-hint">TAP / DRAG TO LAUNCH</div>

        <!-- Home Page / Main Menu Overlay -->
        <div id="home-menu" class="menu-overlay active">
            <div class="home-card">
                <div class="home-title-box">
                    <div class="home-badge">CYBER ARCADE</div>
                    <h1 class="home-title">BRICKS<br><span class="cyan-glow">BREAKER</span></h1>
                    <div class="home-subtitle">100 CYBER LEVELS</div>
                </div>

                <div class="home-stats-preview">
                    <div class="stat-badge">
                        <span class="lbl">HIGHEST LEVEL</span>
                        <span id="home-unlocked-level" class="val">1 / 100</span>
                    </div>
                    <div class="stat-badge">
                        <span class="lbl">HIGH SCORE</span>
                        <span id="home-high-score" class="val">0</span>
                    </div>
                </div>

                <div class="home-btn-group">
                    <button id="tap-to-play-btn" class="cyber-btn big-pulse">
                        <span class="btn-icon">▶</span> TAP TO PLAY
                    </button>
                    <button id="home-level-select-btn" class="cyber-btn secondary">
                        <span class="btn-icon">☰</span> LEVEL SELECT
                    </button>
                    <button id="home-settings-btn" class="cyber-btn secondary">
                        <span class="btn-icon">⚙</span> SETTINGS
                    </button>
                </div>
            </div>
        </div>

        <!-- Level Select Modal (100 Levels) -->
        <div id="level-select-modal" class="modal">
            <div class="modal-card wide-card">
                <div class="modal-title cyan-text">SELECT LEVEL</div>
                
                <!-- Tier Tabs -->
                <div class="level-tabs">
                    <button class="tab-btn active" data-tab="0">1 - 25</button>
                    <button class="tab-btn" data-tab="1">26 - 50</button>
                    <button class="tab-btn" data-tab="2">51 - 75</button>
                    <button class="tab-btn" data-tab="3">76 - 100</button>
                </div>

                <!-- 5x5 Level Grid -->
                <div id="level-grid" class="level-grid-container"></div>

                <div class="btn-group single-btn">
                    <button id="close-level-select-btn" class="cyber-btn secondary">BACK TO MENU</button>
                </div>
            </div>
        </div>

        <!-- Pause Modal -->
        <div id="pause-modal" class="modal">
            <div class="modal-card">
                <div class="modal-title">GAME PAUSED</div>
                <div class="modal-stats">
                    <div class="stat-row">
                        <span>CURRENT SCORE</span>
                        <span id="pause-score" class="stat-val">0</span>
                    </div>
                    <div class="stat-row">
                        <span>LEVEL</span>
                        <span id="pause-level" class="stat-val">1</span>
                    </div>
                </div>
                <div class="btn-group">
                    <button id="resume-btn" class="cyber-btn">RESUME</button>
                    <button id="restart-pause-btn" class="cyber-btn secondary">RESTART</button>
                    <button id="pause-level-select-btn" class="cyber-btn secondary">LEVEL SELECT</button>
                    <button id="settings-pause-btn" class="cyber-btn secondary">SETTINGS</button>
                    <button id="pause-home-btn" class="cyber-btn secondary">HOME MENU</button>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal">
            <div class="modal-card">
                <div class="modal-title">SETTINGS</div>
                <div class="settings-option">
                    <span>SOUND FX</span>
                    <label class="switch">
                        <input type="checkbox" id="sound-toggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="settings-option">
                    <span>SYNTH MUSIC</span>
                    <label class="switch">
                        <input type="checkbox" id="music-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="btn-group">
                    <button id="close-settings-btn" class="cyber-btn">APPLY & CLOSE</button>
                </div>
            </div>
        </div>

        <!-- Level Complete Modal -->
        <div id="victory-modal" class="modal">
            <div class="modal-card">
                <div class="modal-title gold">STAGE CLEARED!</div>
                <div class="modal-stats">
                    <div class="stat-row">
                        <span>LEVEL SCORE</span>
                        <span id="victory-score" class="stat-val">0</span>
                    </div>
                    <div class="stat-row">
                        <span>HIGH SCORE</span>
                        <span id="victory-high" class="stat-val">0</span>
                    </div>
                </div>
                <div class="btn-group">
                    <button id="next-level-btn" class="cyber-btn">NEXT STAGE</button>
                    <button id="victory-select-btn" class="cyber-btn secondary">LEVEL SELECT</button>
                    <button id="replay-level-btn" class="cyber-btn secondary">REPLAY</button>
                    <button id="victory-home-btn" class="cyber-btn secondary">HOME MENU</button>
                </div>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="gameover-modal" class="modal">
            <div class="modal-card">
                <div class="modal-title red">SYSTEM OVERLOAD</div>
                <div class="modal-stats">
                    <div class="stat-row">
                        <span>FINAL SCORE</span>
                        <span id="gameover-score" class="stat-val">0</span>
                    </div>
                    <div class="stat-row">
                        <span>HIGH SCORE</span>
                        <span id="gameover-high" class="stat-val">0</span>
                    </div>
                </div>
                <div class="btn-group">
                    <button id="retry-btn" class="cyber-btn">RETRY</button>
                    <button id="gameover-select-btn" class="cyber-btn secondary">LEVEL SELECT</button>
                    <button id="gameover-home-btn" class="cyber-btn secondary">HOME MENU</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="scripts/audio.js"></script>
    <script src="scripts/game.js"></script>
</body>
</html>
