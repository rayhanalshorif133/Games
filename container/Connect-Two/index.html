<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Connect The Dots - Construct 3 Edition</title>

    <!-- Construct 3 Manifests & PWA Meta -->
    <link rel="manifest" href="appmanifest.json" />
    <link rel="apple-touch-icon" sizes="128x128" href="icons/icon-128.png" />
    <link rel="apple-touch-icon" sizes="256x256" href="icons/icon-256.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png" />
    <link rel="icon" type="image/png" href="icons/icon-32.png" />

    <!-- Mobile App Capabilities -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#27AE60" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Construct 3 Viewport Container (1080x1920) -->
    <div id="c3container">
      <div id="game-viewport">
        <div id="app"></div>
      </div>
    </div>

    <!-- Score API Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
      if (typeof window.axios === 'undefined') {
        window.axios = {
          post: async (url, data, config = {}) => {
            const res = await fetch(url, {
              method: 'POST',
              headers: config.headers || { 'Content-Type': 'application/json' },
              body: JSON.stringify(data),
              credentials: config.withCredentials ? 'include' : 'same-origin'
            });
            const resData = await res.json().catch(() => ({}));
            return { data: resData, status: res.status };
          }
        };
      }
    </script>
    <script src="send_score_api.js"></script>

    <!-- Construct 3 Modular Runtime Architecture -->
    <script src="c3runtime.js"></script>
    <script src="scripts/supportcheck.js"></script>
    <script src="scripts/audio.js"></script>
    <script src="scripts/particles.js"></script>
    <script src="scripts/physics.js"></script>
    <script src="scripts/state.js"></script>
    <script src="scripts/board.js"></script>
    <script src="scripts/ui.js"></script>
    <script src="scripts/input.js"></script>
    <script src="scripts/main.js"></script>
    <script src="scripts/register-sw.js"></script>
  </body>
</html>
