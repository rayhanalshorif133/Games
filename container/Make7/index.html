<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a0c05">
    <title>MAKE 7 - Mobile Puzzle Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="appmanifest.json">
    <link rel="icon" type="image/png" href="icons/icon-32.png">
    <link rel="apple-touch-icon" href="icons/icon-128.png">
</head>
<body>

    <!-- Master Viewport Scaled to Fit Mobile Display -->
    <main id="viewport">
        <div id="canvas-container">

            <!-- TOP HUD (Y: 60 - 320) -->
            <header class="hud-top">
                <!-- Left: Pause Button & Score -->
                <div class="hud-left">
                    <button id="btn-pause" class="btn-pause-circle" title="Pause Game">
                        <div class="pause-bar"></div>
                        <div class="pause-bar"></div>
                    </button>
                    <button id="btn-settings" class="btn-pause-circle" title="Settings">
                        <svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="#e2e8f0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </button>
                    <div class="score-display-group">
                        <span id="score-val" class="score-main-val">0</span>
                    </div>
                </div>

                <!-- Right: Best Score & Coins -->
                <div class="hud-right">
                    <!-- Best Score with Trophy -->
                    <div class="stat-pill">
                        <img src="images/icon_trophy.png" class="stat-icon" alt="Trophy">
                        <span id="best-val">0</span>
                    </div>

                    <!-- Coins Wallet -->
                    <div class="stat-pill">
                        <span style="display: inline-block; width: 36px; height: 36px; background: #f2c026; border-radius: 50%; border: 3px solid #d4a01c;"></span>
                        <span id="coin-val">350</span>
                    </div>
                </div>
            </header>

            <!-- Combo Popup Banner -->
            <div id="combo-banner">2 COMBO!</div>

            <!-- CENTER 19-CELL HEXAGONAL HONEYCOMB BOARD -->
            <section id="board-wrapper">
                <canvas id="board-canvas" width="860" height="780"></canvas>
            </section>

            <!-- BOTTOM ROTATABLE PIECE SPAWNER DOCK WITH SIDE ROTATE BUTTON (Y: 1240 - 1620) -->
            <section id="spawner-wrapper">
                <div id="spawner-container" title="Drag piece to place on board!">
                    <canvas id="spawner-canvas" width="440" height="340"></canvas>
                </div>

                <!-- Dedicated Side Rotate Button -->
                <button id="btn-side-rotate" class="side-rotate-btn" title="Rotate Piece 60°">
                    <div class="rotate-icon-circle">
                        <svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                        </svg>
                    </div>
                    <span class="rotate-label">ROTATE</span>
                </button>
            </section>

            <!-- BOTTOM BOOSTER TOOLBAR (Y: 1680 - 1860) -->
            <footer class="bottom-boosters">
                <!-- 1. Trash Booster (Cost 100) -->
                <button id="btn-booster-trash" class="booster-btn" title="Discard Current Piece (100 Coins)">
                    <img src="images/booster_trash.png" alt="Trash">
                </button>

                <!-- 2. Hammer Booster (Cost 100) -->
                <button id="btn-booster-hammer" class="booster-btn" title="Smash Single Tile (100 Coins)">
                    <img src="images/booster_hammer.png" alt="Hammer">
                </button>

                <!-- 3. Undo Booster (Cost 100) -->
                <button id="btn-booster-undo" class="booster-btn" title="Undo Move (100 Coins)">
                    <img src="images/booster_undo.png" alt="Undo">
                </button>
            </footer>

            <!-- Full-Canvas Particles & Shockwaves -->
            <canvas id="fx-canvas" width="1080" height="1920"></canvas>

            <!-- ========================================================
                 MODALS: SETTINGS, PAUSE & GAME OVER
                 ======================================================== -->

            <!-- 1. SETTINGS MODAL -->
            <div id="modal-settings" class="modal-overlay">
                <div class="generic-modal-card settings-card">
                    <h2 class="generic-modal-title">SETTINGS</h2>

                    <div class="settings-list">
                        <!-- Music Toggle -->
                        <div class="settings-row">
                            <div class="settings-label-group">
                                <div class="settings-icon-bubble">
                                    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M9 18V5l12-2v13"/>
                                        <circle cx="6" cy="18" r="3"/>
                                        <circle cx="18" cy="16" r="3"/>
                                    </svg>
                                </div>
                                <span class="settings-label">Music</span>
                            </div>
                            <button id="toggle-music" class="toggle-pill active" aria-label="Toggle Music">
                                <span class="toggle-thumb"></span>
                                <span class="toggle-label-text">ON</span>
                            </button>
                        </div>

                        <!-- Sound FX Toggle -->
                        <div class="settings-row">
                            <div class="settings-label-group">
                                <div class="settings-icon-bubble">
                                    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                                    </svg>
                                </div>
                                <span class="settings-label">Sound FX</span>
                            </div>
                            <button id="toggle-sound" class="toggle-pill active" aria-label="Toggle Sound Effects">
                                <span class="toggle-thumb"></span>
                                <span class="toggle-label-text">ON</span>
                            </button>
                        </div>
                    </div>

                    <div class="modal-btn-row" style="margin-top: 40px;">
                        <button id="btn-settings-close" class="btn-action-teal" style="width: 360px; height: 96px; font-size: 36px;">DONE</button>
                    </div>
                </div>
            </div>

            <!-- 2. PAUSE MODAL -->
            <div id="modal-pause" class="modal-overlay">
                <div class="generic-modal-card">
                    <h2 class="generic-modal-title">GAME PAUSED</h2>
                    <p style="font-size: 36px; color: #94a3b8; margin-bottom: 30px;">Take a break and plan your next match!</p>
                    <div class="modal-btn-col">
                        <button id="btn-pause-resume" class="btn-action-teal" style="width: 480px; height: 105px; font-size: 38px;">RESUME</button>
                        <button id="btn-pause-restart" class="btn-action-secondary" style="width: 480px; height: 96px; font-size: 34px;">RESTART</button>
                    </div>
                </div>
            </div>

            <!-- 3. GAME OVER MODAL -->
            <div id="modal-gameover" class="modal-overlay">
                <div class="generic-modal-card">
                    <h2 class="generic-modal-title" style="color: #ef4444;">GAME OVER</h2>
                    <div class="modal-stat-row">Final Score: <span id="gameover-final-val" class="modal-stat-val">0</span></div>
                    <div class="modal-stat-row">Best Score: <span id="gameover-best-val" class="modal-stat-val">0</span></div>
                    <div class="modal-btn-row" style="margin-top: 30px;">
                        <button id="btn-gameover-retry" class="btn-action-teal" style="width: 380px;">TRY AGAIN</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Axios Library & Fallback -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        if (typeof window.axios === 'undefined') {
            window.axios = {
                post: async (url, data, config = {}) => {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: config.headers || { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data),
                        credentials: config.withCredentials ? 'include' : 'same-origin'
                    });
                    const resData = await res.json().catch(() => ({}));
                    return { data: resData, status: res.status };
                }
            };
        }
    </script>
    <!-- Send Score API -->
    <script src="send_score_api.js"></script>

    <script src="scripts/supportCheck.js"></script>
    <script src="media/audio.js"></script>
    <script src="c3runtime.js"></script>
    <script src="scripts/main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
