<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070614">
  <title>Flappy Bounce</title>
  <link rel="manifest" href="appmanifest.json">
  <link rel="icon" type="image/png" href="icons/icon-256.png">
  <link rel="apple-touch-icon" href="icons/icon-256.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-container">
    <!-- 1080 x 1920 Native Logical Canvas -->
    <canvas id="gameCanvas" width="1080" height="1920"></canvas>

    <!-- In-Game HUD -->
    <div id="hud-overlay" class="ui-layer">
      <div class="hud-top-bar">
        <button id="btn-pause" class="icon-btn interactive" aria-label="Pause Game">
          <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <div class="score-counter-wrap">
          <div id="hud-score">0</div>
          <div id="combo-badge">COMBO x2</div>
        </div>

        <button id="btn-sound-hud" class="icon-btn interactive" aria-label="Toggle Sound">
          <svg id="icon-sound-on-hud" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg id="icon-sound-off-hud" style="display:none;" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
      </div>
    </div>

    <!-- Start Menu Overlay -->
    <div id="start-screen" class="screen-modal interactive active">
      <div class="menu-content">
        <div class="game-title-wrap">
          <div class="game-badge">Ultra Vibrant 2D</div>
          <h1 class="game-title">FLAPPY<br>BOUNCE</h1>
        </div>

        <div class="character-preview">
          <div class="preview-orb">
            <div class="preview-wing"></div>
            <div class="preview-eye left"><div class="preview-pupil"></div></div>
            <div class="preview-eye right"><div class="preview-pupil"></div></div>
          </div>
        </div>

        <div class="high-score-banner">
          <svg viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .55-.45 1-1 1H6c-.55 0-1-.45-1-1v-1h14v1z"/></svg>
          <span>BEST: <b id="menu-best-score">0</b></span>
        </div>

        <button id="btn-start" class="cta-button">
          START GAME
        </button>

        <p class="tap-hint">Tap screen or Spacebar to Bounce & Flap</p>
      </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-screen" class="screen-modal interactive">
      <div class="gameover-card">
        <h2 class="gameover-title">GAME OVER</h2>

        <div class="medal-wrap">
          <div id="medal-icon" class="medal-icon">🥉</div>
          <div id="medal-name" class="medal-name">BRONZE BOUNCER</div>
          <div id="new-best-ribbon" class="new-best-ribbon">⭐ NEW RECORD! ⭐</div>
        </div>

        <div class="score-stats-grid">
          <div class="stat-box">
            <div class="stat-label">Score</div>
            <div id="stat-final-score" class="stat-val">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Best</div>
            <div id="stat-best-score" class="stat-val highlight">0</div>
          </div>
        </div>

        <button id="btn-restart" class="cta-button">
          PLAY AGAIN
        </button>
      </div>
    </div>

    <!-- Pause Overlay -->
    <div id="pause-screen" class="screen-modal interactive">
      <div class="pause-card">
        <h2 class="pause-title">GAME PAUSED</h2>
        <div class="pause-btn-group">
          <button id="btn-resume" class="cta-button" style="margin-bottom: 8px;">
            RESUME
          </button>
          <button id="btn-quit" class="secondary-btn">
            MAIN MENU
          </button>
        </div>
      </div>
    </div>

    <!-- Gorgeous Custom Neon Cursor Elements -->
    <div id="custom-cursor-dot"></div>
    <div id="custom-cursor-ring"></div>
  </div>

  <script src="scoresendapi.js"></script>
  <script src="game.js"></script>
</body>
</html>
