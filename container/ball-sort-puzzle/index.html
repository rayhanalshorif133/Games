<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Balls Sort Puzzle</title>

    <link rel="apple-touch-icon" sizes="128x128" href="icons/icon-128.png">
    <link rel="apple-touch-icon" sizes="256x256" href="icons/icon-256.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
    <link rel="icon" type="image/png" href="icons/icon-512.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-wrapper">
        <canvas id="game-canvas" width="1080" height="1920"></canvas>

        <div id="loading-overlay">
            <img id="loading-logo" src="assets/logo_balls_sort.png" alt="Balls Sort Puzzle">
            <div class="spinner"></div>
            <div id="loading-text">Loading... 0%</div>
        </div>
    </div>

    <!-- Game Scripts -->
    <script src="scripts/sendscoreapi.js"></script>
    <script src="scripts/audio.js"></script>
    <script src="scripts/levels.js"></script>
    <script src="scripts/game.js"></script>

</body>
</html>
