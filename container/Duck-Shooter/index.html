<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Duck Shooter - Infinite Carnival Arcade (1080x1920)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a0b05">

  <link rel="manifest" href="appmanifest.json">
  <link rel="icon" type="image/png" href="icons/icon-256.png">
  <link rel="apple-touch-icon" href="icons/icon-128.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient carnival backdrop / letterbox border -->
  <div id="game-wrapper">
    <div id="game-container">
      <canvas id="gameCanvas" width="1080" height="1920"></canvas>
    </div>
  </div>

  <noscript>
    <div id="notSupportedWrap">
      <h2 id="notSupportedTitle">JavaScript Required</h2>
      <p class="notSupportedMessage">Please enable JavaScript in your browser to play Duck Shooter.</p>
    </div>
  </noscript>

  <script src="scripts/sendscoreapi.js"></script>
  <script src="scripts/game.js"></script>
</body>
</html>
