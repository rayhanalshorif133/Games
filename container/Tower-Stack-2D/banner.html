<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tower Stacker 2D - 1000x600 UI Banner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0b1509;
      background: radial-gradient(circle at center, #1b3512 0%, #081006 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      font-family: 'Rubik', sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    .banner-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .banner-frame {
      width: 1000px;
      height: 600px;
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 
        0 16px 0 #000000, 
        0 24px 60px rgba(0, 0, 0, 0.8), 
        0 0 40px rgba(142, 201, 124, 0.35);
      border: 6px solid #000000;
      background: #8fc87c;
    }

    #bannerCanvas {
      width: 1000px;
      height: 600px;
      display: block;
    }

    .toolbar {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .toolbar-btn {
      padding: 14px 28px;
      border-radius: 14px;
      background: linear-gradient(180deg, #ffca28 0%, #f57f17 100%);
      border: 4px solid #000000;
      color: #000000;
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 5px 0 #000000;
      transition: transform 0.08s, box-shadow 0.08s, filter 0.2s;
      text-decoration: none;
    }

    .toolbar-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #000000;
      filter: brightness(1.1);
    }

    .toolbar-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #000000;
    }

    .toolbar-btn.secondary {
      background: linear-gradient(180deg, #3bc1d3 0%, #0097a7 100%);
      color: #ffffff;
      text-shadow: 1px 1px 0 #000000;
    }

    .banner-info {
      font-size: 13px;
      color: #a4d697;
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    /* Clean Full Frame Capture Mode */
    body.capture-mode {
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: transparent !important;
    }
    body.capture-mode .banner-frame {
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    body.capture-mode .toolbar,
    body.capture-mode .banner-info {
      display: none !important;
    }
  </style>
  <script>
    if (window.location.search.includes('capture')) {
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('capture-mode');
      });
    }
  </script>
</head>
<body>

  <div class="banner-wrapper">
    <div class="banner-frame">
      <!-- 1000 x 600 Promotional Banner Canvas -->
      <canvas id="bannerCanvas" width="1000" height="600"></canvas>
    </div>

    <div class="toolbar">
      <button id="btn-download" class="toolbar-btn">
        <span>💾 DOWNLOAD 1000x600 PNG</span>
      </button>
      <a href="index.html" class="toolbar-btn secondary">
        <span>🎮 PLAY GAME</span>
      </a>
    </div>

    <div class="banner-info">
      📐 Resolution: 1000 x 600 px | Perfect for Game Portals, Store Banners & Previews
    </div>
  </div>

  <script>
    const canvas = document.getElementById('bannerCanvas');
    const ctx = canvas.getContext('2d');
    const W = 1000;
    const H = 600;

    const PALETTE = [
      { top: '#6be4f7', fill: '#3bc1d3', dark: '#1b6e7a', name: 'cyan' },
      { top: '#ff8a4f', fill: '#f76928', dark: '#a53e0d', name: 'orange' },
      { top: '#ccf044', fill: '#acc63a', dark: '#697c18', name: 'green' },
      { top: '#ffe566', fill: '#fbc930', dark: '#ad820e', name: 'yellow' },
      { top: '#ff7777', fill: '#ff5252', dark: '#a81c1c', name: 'red' }
    ];

    let animTime = 0;

    function drawCharacterBlock(x, y, size, colorData, tilt = 0, lookX = 0, lookY = 0, expression = 'happy', openMouth = false) {
      ctx.save();
      ctx.translate(x + size / 2, y + size / 2);
      ctx.rotate(tilt);

      const radius = size * 0.13;

      // 1. Drop shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
      ctx.beginPath();
      ctx.roundRect(-size / 2, -size / 2 + 8, size, size, radius);
      ctx.fill();

      // 2. Gradient body fill
      const grad = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
      grad.addColorStop(0, colorData.top);
      grad.addColorStop(0.35, colorData.fill);
      grad.addColorStop(1, colorData.dark);

      ctx.beginPath();
      ctx.roundRect(-size / 2, -size / 2, size, size, radius);
      ctx.fillStyle = grad;
      ctx.fill();

      // 3. Bottom bevel & Top gloss highlight
      ctx.save();
      ctx.clip();

      ctx.fillStyle = colorData.dark;
      ctx.beginPath();
      ctx.roundRect(-size / 2, size / 2 - size * 0.18, size, size * 0.18, [0, 0, radius, radius]);
      ctx.fill();

      const glossGrad = ctx.createLinearGradient(0, -size / 2 + 4, 0, -size / 2 + size * 0.2);
      glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.52)');
      glossGrad.addColorStop(1, 'rgba(255, 255, 255, 0.06)');
      ctx.fillStyle = glossGrad;
      ctx.beginPath();
      ctx.roundRect(-size / 2 + 6, -size / 2 + 5, size - 12, size * 0.18, radius * 0.6);
      ctx.fill();
      ctx.restore();

      // 4. Bold black outer border
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = Math.max(5, size * 0.06);
      ctx.stroke();

      // 5. Rosy blush cheeks
      ctx.fillStyle = 'rgba(255, 75, 125, 0.42)';
      const cheekDist = size * 0.28;
      const cheekY = size * 0.1;
      ctx.beginPath();
      ctx.ellipse(-cheekDist, cheekY, size * 0.08, size * 0.045, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cheekDist, cheekY, size * 0.08, size * 0.045, 0, 0, Math.PI * 2);
      ctx.fill();

      // 6. Mouth
      if (openMouth) {
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(0, size * 0.14, size * 0.045, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = Math.max(3, size * 0.035);
        ctx.lineCap = 'round';
        ctx.beginPath();
        if (expression === 'happy') {
          ctx.arc(0, size * 0.1, size * 0.06, 0.15 * Math.PI, 0.85 * Math.PI);
        } else {
          ctx.arc(0, size * 0.17, size * 0.05, Math.PI * 1.15, Math.PI * 1.85);
        }
        ctx.stroke();
      }

      // 7. Eyes with specular sparkles
      const eyeR = size * 0.11;
      const eyeSpacing = size * 0.3;
      const eyeY = -size * 0.04;
      const eyePositions = [-eyeSpacing / 2, eyeSpacing / 2];

      eyePositions.forEach(ex => {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ex, eyeY, eyeR, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = Math.max(3, size * 0.035);
        ctx.stroke();

        // Pupil
        const pupilR = eyeR * 0.48;
        const px = ex + lookX * (eyeR * 0.35);
        const py = eyeY + lookY * (eyeR * 0.35);

        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(px, py, pupilR, 0, Math.PI * 2);
        ctx.fill();

        // Dual Sparkles
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(px - pupilR * 0.35, py - pupilR * 0.35, pupilR * 0.38, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(px + pupilR * 0.32, py + pupilR * 0.32, pupilR * 0.2, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();
    }

    function drawGoldenStar(cx, cy, spikes, outerRadius, innerRadius, color = '#ffeb3b') {
      let rot = (Math.PI / 2) * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;

      ctx.save();
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.restore();
    }

    function renderBanner() {
      animTime += 0.016;

      // 1. Lush Bamboo Sky Background Gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
      skyGrad.addColorStop(0, '#b8e3ad');
      skyGrad.addColorStop(0.55, '#8fc87c');
      skyGrad.addColorStop(1, '#689f4b');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, H);

      // 2. Parallax Bamboo Stalks
      // Back Layer
      ctx.fillStyle = '#7eb34c';
      const backStalks = [
        { x: 40, w: 32 }, { x: 180, w: 28 }, { x: 380, w: 36 }, 
        { x: 620, w: 34 }, { x: 880, w: 42 }
      ];
      backStalks.forEach(s => {
        ctx.fillRect(s.x, 0, s.w, H);
        ctx.fillStyle = '#6b9c3e';
        for (let ny = 80; ny < H; ny += 140) {
          ctx.fillRect(s.x - 2, ny, s.w + 4, 7);
        }
        ctx.fillStyle = '#7eb34c';
      });

      // Floating Translucent Bubbles
      for (let i = 0; i < 18; i++) {
        const bx = (Math.sin(i * 45 + animTime * 0.4) * 0.5 + 0.5) * W;
        const by = ((i * 38 - animTime * 25) % (H + 40) + H + 40) % (H + 40) - 20;
        const br = 10 + (i % 4) * 6;

        ctx.save();
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(bx, by, br, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(bx, by, br * 0.75, -Math.PI * 0.7, -Math.PI * 0.1);
        ctx.stroke();
        ctx.restore();
      }

      // Front Bamboo Layer
      ctx.fillStyle = '#8dc77b';
      const frontStalks = [
        { x: 110, w: 44 }, { x: 490, w: 48 }, { x: 940, w: 52 }
      ];
      frontStalks.forEach(s => {
        ctx.fillRect(s.x, 0, s.w, H);
        ctx.fillStyle = '#7ab467';
        for (let ny = 120; ny < H; ny += 160) {
          ctx.fillRect(s.x - 3, ny, s.w + 6, 8);
        }
        ctx.fillStyle = '#8dc77b';
      });

      // 3. Ground Silhouette Rocks
      const groundY = 540;
      ctx.fillStyle = '#326400';
      ctx.beginPath();
      ctx.moveTo(0, groundY + 12);
      ctx.lineTo(140, groundY - 14);
      ctx.lineTo(310, groundY + 6);
      ctx.lineTo(480, groundY - 20);
      ctx.lineTo(660, groundY + 8);
      ctx.lineTo(840, groundY - 16);
      ctx.lineTo(W, groundY);
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.closePath();
      ctx.fill();

      // Black ground bottom strip
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, groundY + 8, W, 14);

      // 4. RIGHT SIDE: THE LEANING TOWER STACK
      const stackBaseX = 730;
      const bSize = 125;

      // Base Block (Orange)
      drawCharacterBlock(stackBaseX, groundY - bSize + 8, bSize, PALETTE[1], 0, 0, -0.6, 'happy');

      // Block 2 (Cyan)
      const b2Y = groundY - bSize * 2 + 16;
      drawCharacterBlock(stackBaseX + 6, b2Y, bSize, PALETTE[0], 0.02, 0.4, -0.6, 'happy');

      // Block 3 (Lime Green - slight offset)
      const b3Y = groundY - bSize * 3 + 24;
      drawCharacterBlock(stackBaseX + 22, b3Y, bSize, PALETTE[2], 0.05, -0.5, -0.6, 'happy');

      // Block 4 (Sunny Yellow)
      const b4Y = groundY - bSize * 4 + 32;
      drawCharacterBlock(stackBaseX + 12, b4Y, bSize, PALETTE[3], -0.02, 0.2, -0.7, 'happy');

      // 5. DROPPING INCOMING BLOCK (Red / Violet at top right)
      const dropSine = Math.sin(animTime * 2.2);
      const activeX = stackBaseX + 15 + dropSine * 30;
      const activeY = 60 + Math.sin(animTime * 4.0) * 8;

      // Drop Motion Speed Lines
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      [-30, 0, 30].forEach(ox => {
        ctx.beginPath();
        ctx.moveTo(activeX + bSize / 2 + ox, activeY - 24);
        ctx.lineTo(activeX + bSize / 2 + ox, activeY - 6);
        ctx.stroke();
      });
      ctx.restore();

      // Active Block looking straight down anticipating drop
      drawCharacterBlock(activeX, activeY, bSize, PALETTE[4], dropSine * 0.06, 0, 0.8, 'happy', true);

      // Golden Stars & Sparkles
      const starPulse = Math.sin(animTime * 5) * 4;
      drawGoldenStar(stackBaseX - 30, b3Y + 30, 5, 20 + starPulse, 9, '#ffeb3b');
      drawGoldenStar(stackBaseX + bSize + 25, b4Y + 20, 5, 24 - starPulse, 10, '#ffd700');
      drawGoldenStar(stackBaseX + bSize + 40, b2Y + 40, 5, 16 + starPulse, 7, '#ffffff');

      // Combo Toast Floating Pill: "PERFECT! x3"
      ctx.save();
      ctx.translate(stackBaseX - 45, b4Y - 15);
      ctx.rotate(-0.08);
      ctx.fillStyle = '#ffea00';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.roundRect(-90, -22, 180, 44, 14);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#000000';
      ctx.font = '900 17px Rubik, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('★ PERFECT! x3 ★', 0, 1);
      ctx.restore();

      // 6. LEFT SIDE: GAME BRANDING & UI SHOWCASE
      // Main 3D Arcade Title: TOWER STACK 2D
      ctx.save();
      ctx.textAlign = 'left';

      // Title Line 1: TOWER
      ctx.font = '900 68px Rubik, sans-serif';
      const titleX = 58;
      const titleY = 135;

      // Dark 3D extrude
      ctx.fillStyle = '#000000';
      for (let d = 8; d >= 1; d--) {
        ctx.fillText('TOWER', titleX + d, titleY + d);
      }
      ctx.fillStyle = '#ffffff';
      ctx.fillText('TOWER', titleX, titleY);
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 9;
      ctx.strokeText('TOWER', titleX, titleY);
      ctx.fillText('TOWER', titleX, titleY);

      // Title Line 2: STACK 2D
      ctx.font = '900 68px Rubik, sans-serif';
      const line2Y = 208;
      for (let d = 8; d >= 1; d--) {
        ctx.fillText('STACK 2D', titleX + d, line2Y + d);
      }
      // Gradient text
      const textGrad = ctx.createLinearGradient(titleX, line2Y - 60, titleX, line2Y);
      textGrad.addColorStop(0, '#fff176');
      textGrad.addColorStop(1, '#ffb300');
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 9;
      ctx.strokeText('STACK 2D', titleX, line2Y);
      ctx.fillStyle = textGrad;
      ctx.fillText('STACK 2D', titleX, line2Y);

      // Subtitle Tagline
      ctx.font = '700 19px Rubik, sans-serif';
      ctx.fillStyle = '#17300c';
      ctx.fillText('THE ULTIMATE BAMBOO BALANCING ARCADE', titleX, 248);

      ctx.restore();

      // 7. HUD BADGE CAPSULES (Based on exact game UI styling)
      const badgeY = 285;
      const badges = [
        { icon: '⚡', label: 'RULES', val: '1 MISS = GAME OVER', color: '#ff5252' },
        { icon: '📱', label: 'CANVAS', val: '1080 x 1920 HD', color: '#64ffda' },
        { icon: '🏆', label: 'COMBO', val: 'PERFECT STACK CHIMES', color: '#ffd54f' }
      ];

      badges.forEach((b, idx) => {
        const by = badgeY + idx * 56;
        ctx.save();
        ctx.translate(titleX, by);

        // Capsule background
        const bGrad = ctx.createLinearGradient(0, 0, 0, 44);
        bGrad.addColorStop(0, 'rgba(28, 54, 18, 0.94)');
        bGrad.addColorStop(1, 'rgba(12, 24, 8, 0.98)');
        ctx.fillStyle = bGrad;
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3.5;

        ctx.beginPath();
        ctx.roundRect(0, 0, 440, 44, 14);
        ctx.fill();
        ctx.stroke();

        // 3D Bottom shadow
        ctx.fillStyle = '#000000';
        ctx.fillRect(10, 43, 420, 3);

        // Gloss highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.beginPath();
        ctx.roundRect(4, 3, 432, 18, [11, 11, 0, 0]);
        ctx.fill();

        // Content
        ctx.font = '900 18px Rubik, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.icon, 14, 23);

        ctx.font = '900 12px Rubik, sans-serif';
        ctx.fillStyle = '#9fe08b';
        ctx.fillText(b.label, 44, 23);

        ctx.font = '900 14px "Press Start 2P", monospace';
        ctx.fillStyle = b.color;
        ctx.textAlign = 'right';
        ctx.fillText(b.val, 424, 24);

        ctx.restore();
      });

      // 8. BIG ARCADE CTA BUTTON: TAP TO PLAY
      const btnX = titleX;
      const btnY = 466;
      const btnW = 340;
      const btnH = 68;

      ctx.save();
      ctx.translate(btnX, btnY);

      // 3D Shadow
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.roundRect(0, 8, btnW, btnH, 18);
      ctx.fill();

      // Button Body
      const btnGrad = ctx.createLinearGradient(0, 0, 0, btnH);
      btnGrad.addColorStop(0, '#ffe082');
      btnGrad.addColorStop(0.4, '#ffca28');
      btnGrad.addColorStop(1, '#ff8f00');
      ctx.fillStyle = btnGrad;
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.roundRect(0, 0, btnW, btnH, 18);
      ctx.fill();
      ctx.stroke();

      // Gloss sheen
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.beginPath();
      ctx.roundRect(6, 4, btnW - 12, 26, [14, 14, 0, 0]);
      ctx.fill();

      // Button Text
      ctx.font = '900 20px "Press Start 2P", monospace';
      ctx.fillStyle = '#000000';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('PLAY NOW ▶', btnW / 2, btnH / 2 + 2);

      ctx.restore();

      // Request next animation frame for interactive preview
      requestAnimationFrame(renderBanner);
    }

    // Start render loop
    renderBanner();

    // 9. DOWNLOAD PNG HANDLER
    document.getElementById('btn-download').addEventListener('click', () => {
      // Draw static frame
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 1000;
      tempCanvas.height = 600;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(canvas, 0, 0);

      const link = document.createElement('a');
      link.download = 'tower-stacker-banner-1000x600.png';
      link.href = tempCanvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
