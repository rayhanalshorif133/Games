<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>Bee Attack</title>
    
    <!-- Game-Related Favicons & Icons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />

    <!-- Standardised Web App Manifest -->
    <link rel="manifest" href="appmanifest.json" />

    <!-- Responsive Viewport Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="HandheldFriendly" content="true" />

    <!-- Main Game Styling -->
    <link rel="stylesheet" href="./css/style.css" />
</head> 
<body> 
    <div id="game-wrapper">
        <!-- Asset Loading Overlay -->
        <div id="loading-overlay">
            <div class="spinner"></div>
            <div class="loading-text">LOADING BEE ATTACK...</div>
            <div class="progress-bar-wrap">
                <div id="progress-bar" class="progress-bar-fill"></div>
            </div>
        </div>

        <!-- Main HTML5 Canvas (480x800 Portrait) -->
        <canvas id="game-canvas" width="480" height="800"></canvas>
    </div>

    <!-- 1. Dedicated Score API Module -->
    <script src="js/scoreapi.js"></script>

    <!-- 2. Dedicated Game Over Redirect Module -->
    <script src="js/gameover.js"></script>

    <!-- 3. Core Game Engine -->
    <script src="js/game.js"></script>
</body> 
</html>
