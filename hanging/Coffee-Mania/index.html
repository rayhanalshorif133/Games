<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coffee Mania - Barista Puzzle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="gameContainer">
  <!-- Main 1080x1920 Game Canvas -->
  <canvas id="gameCanvas" width="1080" height="1920"></canvas>

  <!-- Top HUD Overlay -->
  <div class="hud-overlay">
    <div class="hud-badge" id="hudLevelBadge">
      <span>☕</span>
      <span id="hudLevel">Level 1</span>
    </div>

    <div class="hud-badge">
      <span>📦</span>
      <span id="hudCups">0 / 0</span>
    </div>

    <div class="hud-badge">
      <span>🪙</span>
      <span id="hudCoins">150</span>
    </div>

    <div class="hud-buttons">
      <button class="hud-btn" id="btnMute" title="Mute/Unmute Audio">🔊</button>
      <button class="hud-btn" id="btnLevelSelect" title="Select Level">🗺️</button>
      <button class="hud-btn" id="btnRestart" title="Restart Level">🔄</button>
      <a href="car-game.html" class="hud-btn" style="text-decoration: none;" title="Play Car Direction Escape">🚗</a>
    </div>
  </div>

  <!-- Feedback Toast Popup -->
  <div id="gameFeedback">Tray Packed! +10 Coins ☕</div>

  <!-- Bottom Boosters Bar -->
  <div class="boosters-bar">
    <button class="booster-btn" id="btnUndo" title="Undo last tray placement">↩ Undo (3)</button>
    <button class="booster-btn" id="btnExtraSlot" title="Unlock extra counter slot">➕ +1 Slot (2)</button>
    <button class="booster-btn" id="btnShuffle" title="Shuffle remaining trays">🔀 Shuffle (2)</button>
  </div>

  <!-- Level Completed (Win) Modal -->
  <div class="modal-overlay" id="winModal">
    <div class="modal-card">
      <div class="modal-title" id="winTitle">ORDER COMPLETE!</div>
      <div class="modal-stars" id="winStars">⭐⭐⭐</div>
      <div class="modal-stats" id="winStats"></div>
      <div class="modal-buttons">
        <button class="primary-btn" id="btnNextLevel">Next Level ☕</button>
        <button class="secondary-btn" id="btnWinLevels">All Levels</button>
      </div>
    </div>
  </div>

  <!-- Level Failed (Lose) Modal -->
  <div class="modal-overlay" id="loseModal">
    <div class="modal-card">
      <div class="modal-title" style="color: #ff5252;">COUNTER JAMMED!</div>
      <p style="color: #ffd0b0; font-size: 15px; margin: 12px 0;">
        All slots are full and no tray matches the next coffee cup!
      </p>
      <div class="modal-buttons">
        <button class="primary-btn" id="btnLoseUndo">↩ Undo Move</button>
        <button class="secondary-btn" id="btnLoseRestart">Try Again</button>
      </div>
    </div>
  </div>

  <!-- Level Selection Modal -->
  <div class="modal-overlay" id="levelSelectModal">
    <div class="modal-card" style="max-width: 480px;">
      <div class="modal-title">COFFEE MENU</div>
      <p style="color: #ffd0b0; font-size: 14px;">Select your next barista challenge</p>
      <div class="level-grid" id="levelGrid"></div>
      <div class="modal-buttons">
        <button class="secondary-btn" id="btnCloseLevelSelect">Back to Cafe</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>

</body>
</html>
