<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2c3d"/>
      <stop offset="100%" stop-color="#0a0f16"/>
    </radialGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e93a8"/>
      <stop offset="50%" stop-color="#3b4856"/>
      <stop offset="100%" stop-color="#1b2530"/>
    </linearGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="35%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded plate -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" stroke="#ff9800" stroke-width="8"/>

  <!-- Circuit traces -->
  <path d="M 90 256 L 190 256 L 256 160 L 340 160 L 410 256" fill="none" stroke="#29b6f6" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <circle cx="90" cy="256" r="14" fill="#29b6f6"/>
  <circle cx="410" cy="256" r="14" fill="#29b6f6"/>

  <!-- Main Realistic Dispenser Pod / Outer Chamber -->
  <rect x="116" y="116" width="280" height="280" rx="48" fill="url(#metalRim)" stroke="#ffb74d" stroke-width="6"/>
  <rect x="136" y="136" width="240" height="240" rx="36" fill="#111822"/>

  <!-- Glass Porthole Dome -->
  <circle cx="256" cy="256" r="95" fill="#1b2938" stroke="#00e5ff" stroke-width="5" filter="url(#neonGlow)"/>

  <!-- Numbered Glowing Ball -->
  <circle cx="256" cy="256" r="65" fill="url(#orbGrad)"/>
  <!-- Specular 3D highlight -->
  <ellipse cx="236" cy="230" rx="28" ry="16" fill="#ffffff" opacity="0.75" transform="rotate(-25 236 230)"/>

  <!-- Ball Number "1" or Cooking icon -->
  <text x="256" y="278" font-family="'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.6))">1</text>

  <!-- Status LED on Pod -->
  <circle cx="160" cy="160" r="10" fill="#00e676" filter="url(#neonGlow)"/>
  <circle cx="190" cy="160" r="10" fill="#ff9100"/>
  
  <!-- Connector Plugs -->
  <rect x="396" y="236" width="24" height="40" rx="6" fill="#ffd54f"/>
</svg>

