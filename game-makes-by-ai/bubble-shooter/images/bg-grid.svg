<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <radialGradient id="bgVignette" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#182236"/>
      <stop offset="60%" stop-color="#0e1422"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>
    <linearGradient id="gridLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 210, 211, 0.06)"/>
      <stop offset="50%" stop-color="rgba(255, 45, 85, 0.04)"/>
      <stop offset="100%" stop-color="rgba(0, 122, 255, 0.06)"/>
    </linearGradient>
    <pattern id="hexPattern" width="96" height="166.27" patternUnits="userSpaceOnUse">
      <path d="M 48,0 L 96,27.71 L 96,83.14 L 48,110.85 L 0,83.14 L 0,27.71 Z" fill="none" stroke="url(#gridLine)" stroke-width="1.5"/>
      <path d="M 48,110.85 L 96,138.56 L 96,194 L 48,221.71 L 0,194 L 0,138.56 Z" fill="none" stroke="url(#gridLine)" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Deep Cosmic / Cyberpunk Arena Gradient -->
  <rect width="1080" height="1920" fill="url(#bgVignette)"/>

  <!-- Subtle Hex Grid Backdrop -->
  <rect width="1080" height="1920" fill="url(#hexPattern)" opacity="0.8"/>

  <!-- Upper Atmosphere Glow -->
  <circle cx="540" cy="180" r="450" fill="rgba(0, 122, 255, 0.08)"/>
  <!-- Shooter Atmosphere Glow -->
  <circle cx="540" cy="1720" r="380" fill="rgba(255, 45, 85, 0.07)"/>
</svg>

