<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 160" width="64" height="160">
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00d2d3" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#00d2d3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="arrowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Arrow Shaft -->
  <line x1="32" y1="150" x2="32" y2="40" stroke="url(#arrowGrad)" stroke-width="6" stroke-linecap="round" filter="url(#arrowGlow)"/>
  
  <!-- Arrow Head -->
  <polygon points="32,8 10,48 24,44 32,38 40,44 54,48" fill="#00d2d3" stroke="#ffffff" stroke-width="2" filter="url(#arrowGlow)"/>
  <circle cx="32" cy="18" r="4" fill="#ffffff"/>
</svg>

