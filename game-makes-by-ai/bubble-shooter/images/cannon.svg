<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Metallic Chrome Ring -->
    <linearGradient id="chromeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="30%" stop-color="#cbd5e0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#718096"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>

    <!-- Glass Chamber Gradient -->
    <radialGradient id="glassChamber" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)"/>
      <stop offset="70%" stop-color="rgba(0, 210, 211, 0.15)"/>
      <stop offset="100%" stop-color="rgba(0, 122, 255, 0.3)"/>
    </radialGradient>

    <!-- Glowing Cyan Arc -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Pedestal Base -->
  <path d="M 40,200 C 40,140 200,140 200,200 Z" fill="#141a29" stroke="#2a3b5c" stroke-width="4"/>
  <ellipse cx="120" cy="200" rx="90" ry="24" fill="#0b0f19" stroke="#00d2d3" stroke-width="2"/>

  <!-- Rotating Turret Body (Center at 120, 120) -->
  <g id="turret-rotator">
    <!-- Barrel/Guideway -->
    <path d="M 98,120 L 102,40 L 138,40 L 142,120 Z" fill="url(#chromeRing)" stroke="#1a202c" stroke-width="2"/>
    <ellipse cx="120" cy="40" rx="18" ry="6" fill="#00d2d3" opacity="0.8"/>
    
    <!-- Energy Rails -->
    <line x1="106" y1="110" x2="108" y2="48" stroke="#00ffff" stroke-width="3" filter="url(#neonGlow)"/>
    <line x1="134" y1="110" x2="132" y2="48" stroke="#00ffff" stroke-width="3" filter="url(#neonGlow)"/>

    <!-- Glass Sphere Chamber -->
    <circle cx="120" cy="120" r="54" fill="url(#glassChamber)" stroke="url(#chromeRing)" stroke-width="6"/>
    <circle cx="120" cy="120" r="50" fill="none" stroke="#00d2d3" stroke-width="2" opacity="0.6"/>

    <!-- Glass Specular Highlight -->
    <path d="M 95,95 Q 110,80 135,85" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>

