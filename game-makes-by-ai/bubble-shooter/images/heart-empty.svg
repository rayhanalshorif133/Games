<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="emptyHeartBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff2d55" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Translucent Glass Empty Heart Silhouette -->
  <path d="M 64,28 
           C 54,12 28,12 16,28 
           C 2,46 14,72 64,112 
           C 114,72 126,46 112,28 
           C 100,12 74,12 64,28 Z" 
        fill="rgba(255, 45, 85, 0.08)" 
        stroke="url(#emptyHeartBorder)" 
        stroke-width="3" 
        stroke-dasharray="8,5"/>

  <!-- Subtle inner crack lines indicating broken heart -->
  <path d="M 64,36 L 60,54 L 68,68 L 62,88 L 64,102" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.2)" 
        stroke-width="2.5" 
        stroke-linecap="round"/>
</svg>

