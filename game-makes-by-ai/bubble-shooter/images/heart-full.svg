<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Vibrant 3D Glossy Red Heart Gradient -->
    <radialGradient id="heartBody" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff7b98"/>
      <stop offset="40%" stop-color="#ff2d55"/>
      <stop offset="80%" stop-color="#c4002f"/>
      <stop offset="100%" stop-color="#70001a"/>
    </radialGradient>

    <!-- Ambient Rim Glow -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff6b8b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffe6ec" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Outer Soft Glow -->
    <filter id="heartGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Heart Base Shape with 3D Gradient -->
  <path d="M 64,28 
           C 54,12 28,12 16,28 
           C 2,46 14,72 64,112 
           C 114,72 126,46 112,28 
           C 100,12 74,12 64,28 Z" 
        fill="url(#heartBody)" 
        stroke="url(#rimGlow)" 
        stroke-width="3"
        filter="url(#heartGlow)"/>

  <!-- Top-Left Gloss Specular Highlight -->
  <path d="M 38,22 
           C 28,22 22,30 22,38 
           C 22,46 28,52 34,48 
           C 40,44 44,32 44,26 
           C 44,22 42,22 38,22 Z" 
        fill="#ffffff" 
        opacity="0.75"/>

  <!-- Small Glint Dot -->
  <circle cx="28" cy="48" r="3.5" fill="#ffffff" opacity="0.85"/>
</svg>

