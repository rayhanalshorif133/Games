<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f2a"/>
      <stop offset="50%" stop-color="#19163f"/>
      <stop offset="100%" stop-color="#070b19"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff0077"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Rounded Box -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Perspective Grid Lines -->
  <path d="M 100 512 L 230 240 L 282 240 L 412 512" fill="none" stroke="#2a3563" stroke-width="4"/>
  <line x1="256" y1="240" x2="256" y2="512" stroke="#00f0ff" stroke-width="3" stroke-dasharray="16,12" opacity="0.8"/>
  <line x1="170" y1="360" x2="342" y2="360" stroke="#ff0077" stroke-width="3" opacity="0.6"/>
  <line x1="130" y1="440" x2="382" y2="440" stroke="#00f0ff" stroke-width="4" opacity="0.7"/>

  <!-- Cyber Runner Figure Silhouette -->
  <g filter="url(#glow)">
    <!-- Motion Speed Lines -->
    <path d="M 120 200 L 220 200 M 90 230 L 210 230 M 140 260 L 230 260" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Runner Body / Lightning Bolt Shape -->
    <polygon points="280,100 200,240 260,240 220,380 340,220 270,220" fill="url(#neonGlow)"/>
    
    <!-- Visor Spark -->
    <circle cx="270" cy="140" r="14" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Stylized Border -->
  <rect width="500" height="500" x="6" y="6" rx="96" fill="none" stroke="#00f0ff" stroke-width="6" opacity="0.4"/>
</svg>

